<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>recall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg: #1a1a1a; --muted: #666; --bg: #fff; --card: #f6f6f6; --accent: #2d6cdf; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #aaa; --bg: #141414; --card: #1f1f1f; --accent: #6ea0ff; } }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid #8884; border-radius: 6px; background: var(--card); color: var(--fg); }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  .answer { margin-top: 20px; padding: 14px; background: var(--card); border-radius: 8px; white-space: pre-wrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .src { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--accent); font-size: 14px; }
  .src b { font-family: ui-monospace, monospace; font-size: 13px; }
  .src p { margin: 4px 0 0; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement;

function App() {
  const [q, setQ] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [res, setRes] = React.useState(null);
  const [err, setErr] = React.useState(null);

  async function submit(e) {
    e.preventDefault();
    if (!q.trim()) return;
    setBusy(true); setErr(null);
    try {
      const r = await fetch("/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question: q }) });
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || r.statusText);
      setRes(body);
    } catch (e) { setErr(e.message); setRes(null); }
    finally { setBusy(false); }
  }

  return h("div", null,
    h("h1", null, "recall"),
    h("form", { onSubmit: submit },
      h("input", { value: q, onChange: (e) => setQ(e.target.value), placeholder: "Ask your notes… e.g. When does Harbor GC run?", autoFocus: true }),
      h("button", { disabled: busy }, busy ? "…" : "Ask")),
    err && h("div", { className: "answer" }, "Error: " + err),
    res && h("div", null,
      h("div", { className: "answer" }, res.answer),
      h("div", { className: "meta" },
        `${res.provider} · ${res.mode} · ${res.latencyMs} ms · confidence ${res.confidence.toFixed(2)}` +
        (res.abstained ? " · abstained" : ` · citations ${res.citationsValid ? "valid" : "INVALID"}`)),
      res.sources.map((s) => h("div", { className: "src", key: s.id }, h("b", null, s.id), h("p", null, s.content)))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
